<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Metriq" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Metriq" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Metriq</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved look before the page paints (no flash): light or dark, and in the app (not the public
      // website, see WEBSITE in src/lib/theme.ts) the colour theme and the company's brand colour.
      try {
        var root = document.documentElement
        var app = !/^\/(?:$|pricing|security|product|solutions|terms|privacy|cookies|dpa)(?:\/|$)/.test(location.pathname)
        var t = localStorage.getItem('pt-theme')
        var darkOnly = app && localStorage.getItem('pt-theme-dark-only') === '1'
        if (app) {
          root.setAttribute('data-theme', localStorage.getItem('pt-theme-id') || 'metriq')
          var brand = localStorage.getItem('pt-brand-css')
          if (brand) {
            var s = document.createElement('style')
            s.id = 'pt-brand'
            s.textContent = brand
            document.head.appendChild(s)
            root.setAttribute('data-brand', '')
          }
        }
        if (darkOnly || t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark')
          root.style.colorScheme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E0F11')
        }
      } catch (e) {}
      // Ask who is signed in right away, while the app's files load: one network trip less on every load
      // (lib/auth.tsx takes the answer once). Not on the website or the sign-in pages.
      try {
        if (app && !/^\/(?:login|signup|start|forgot-password|reset-password|reset-success|verify-email|c\/)/.test(location.pathname)) {
          window.__ptMe = fetch('/api/auth/me', { credentials: 'include', headers: { Accept: 'application/json' } })
            .then(function (r) { return r.status === 200 ? r.json().then(function (b) { return { status: 200, body: b } }) : { status: r.status, body: null } })
            .catch(function () { return null })
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
