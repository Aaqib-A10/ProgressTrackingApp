# Runs every test on each push to main or erp (Phase 1, step 1: safety net).
# GitHub shows a green tick or a red cross next to the commit; deploy only on green.
# It uses its own empty PostgreSQL inside GitHub, never the live database, and needs no secrets.
name: Tests

on:
  push:
    branches: [main, erp]
  pull_request:
    branches: [main, erp]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metriq
          POSTGRES_PASSWORD: metriq
          POSTGRES_DB: pulsetrack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U metriq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database that exists only while the tests run.
      DATABASE_URL: postgresql://metriq:metriq@localhost:5432/pulsetrack?schema=public
      NODE_ENV: test
      APP_TIMEZONE: Asia/Karachi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare the database layer
        working-directory: server
        run: npx prisma generate
      - name: Server type check
        working-directory: server
        run: npx tsc --noEmit -p .
      - name: Website type check and build
        run: npm run build -w client
      - name: Unit tests
        working-directory: server
        run: npx vitest run
      - name: Integration tests (whole app against its own database)
        working-directory: server
        run: npx vitest run --config vitest.integration.config.ts

  # Metra's go-live check (server/src/scripts/metraCheck.ts): about a hundred real questions asked through the real
  # model, each answer compared with what the screens hold. It needs a model key, kept as the repository secret
  # GROQ_API_KEY (Settings, Secrets and variables, Actions). Without that secret the job says so and stops, green:
  # it never blocks a push. It runs on pushes only, never for pull requests from forks, so the key is never exposed.
  metra-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metriq
          POSTGRES_PASSWORD: metriq
          POSTGRES_DB: pulsetrack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U metriq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://metriq:metriq@localhost:5432/pulsetrack?schema=public
      APP_TIMEZONE: Asia/Karachi
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # The search index uses the small built-in embedder here: no model download on every run.
      METRA_EMBEDDER: hash
    steps:
      - name: Is there a model key?
        id: key
        run: |
          if [ -n "$GROQ_API_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "No GROQ_API_KEY secret in this repository: the Metra check is skipped."; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == '1'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.key.outputs.ok == '1'
        run: npm ci --include=dev --no-audit --no-fund
      - name: Database and test accounts
        if: steps.key.outputs.ok == '1'
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/test-users.ts
      - name: Metra check (must print "Ready")
        if: steps.key.outputs.ok == '1'
        working-directory: server
        run: npx tsx src/scripts/metraCheck.ts
